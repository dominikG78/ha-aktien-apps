name: Aktien Finnhub Intraday
version: "1.1.0"
slug: aktien_finnhub_intraday
description: Generischer Multi-Instrument-Collector fuer Register 001 bis 020
url: https://github.com/dominikG78/ha-aktien-apps
arch:
  - amd64
startup: application
boot: manual
init: false
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: addon_config
    read_only: true
options:
  enabled: false
  instruments_file: /config/instruments.json
  data_root: /media/COPILOT_DATA/aktien/intraday
  retention_raw_days: 90
  export_points: 1200
  warn_free_gb: 100
  stop_free_gb: 50
  finnhub_api_key: ""
schema:
  enabled: bool
  instruments_file: str
  data_root: str
  retention_raw_days: int(1,365)
  export_points: int(100,5000)
  warn_free_gb: int(20,400)
  stop_free_gb: int(10,300)
  finnhub_api_key: password?
