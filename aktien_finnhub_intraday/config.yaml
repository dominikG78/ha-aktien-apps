name: Aktien Finnhub Intraday
version: "1.0.2"
slug: aktien_finnhub_intraday
description: Isolierter Finnhub-WebSocket-Testdienst fuer echte NVDA-Ticks und OHLC-Kerzen
url: https://github.com/REPOSITORY_OWNER/ha-aktien-apps
arch:
  - amd64
startup: application
boot: manual
init: false
hassio_api: false
homeassistant_api: false
map:
  - share:rw
  - config:ro
options:
  enabled: false
  instrument_id: "006"
  symbol: NVDA
  exchange: NASDAQ
  currency: USD
  retention_raw_days: 90
  export_points: 1200
  warn_free_gb: 100
  stop_free_gb: 50
schema:
  enabled: bool
  instrument_id: str
  symbol: str
  exchange: str
  currency: str
  retention_raw_days: int(1,365)
  export_points: int(100,5000)
  warn_free_gb: int(20,400)
  stop_free_gb: int(10,300)
